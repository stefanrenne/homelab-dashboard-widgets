name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  # A tag vX.Y.Z becomes a GitHub release: the CHANGELOG section as notes, a zip of the whole
  # collection and one zip per widget (<id>-<widget version>.zip) for installing a single widget.
  # Run by hand on main (workflow_dispatch), it releases package.json's version and creates the
  # tag on that commit, for when a tag cannot be pushed.
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: The tag, checked against package.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag="v$pkg"
            if gh release view "$tag" >/dev/null 2>&1; then echo "::error::$tag is already released; bump package.json"; exit 1; fi
          else
            tag="$GITHUB_REF_NAME"
          fi
          if [ "${tag#v}" != "$pkg" ]; then echo "::error::tag $tag but package.json says $pkg"; exit 1; fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Notes and assets
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "::error::CHANGELOG.md has no section for $version"; exit 1; fi
          {
            echo
            echo "| Widget | Version |"
            echo "|---|---|"
            for dir in widgets/*/; do
              id=$(basename "$dir")
              v=$(sed -n 's/^version: *//p' "$dir/widget.yaml")
              echo "| \`$id\` | $v |"
            done
            echo
            echo '```yaml'
            echo "plugins:"
            echo "  - source: git+https://github.com/$GITHUB_REPOSITORY#$TAG"
            echo '```'
          } >> notes.md
          mkdir dist
          zip -qr "dist/homelab-dashboard-widgets-$version.zip" widgets README.md LICENSE 2>/dev/null || zip -qr "dist/homelab-dashboard-widgets-$version.zip" widgets README.md
          for dir in widgets/*/; do
            id=$(basename "$dir")
            v=$(sed -n 's/^version: *//p' "$dir/widget.yaml")
            (cd widgets && zip -qr "../dist/$id-$v.zip" "$id")
          done
          ls dist
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # a pushed tag must exist; by hand, the release creates the tag on this commit
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then target=(--target "$GITHUB_SHA"); else target=(--verify-tag); fi
          gh release create "$TAG" dist/*.zip --title "$TAG" --notes-file notes.md "${target[@]}"
