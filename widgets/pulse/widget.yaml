id: pulse
name: Pulse
version: 0.1.0
apiVersion: 1
description: Proxmox nodes, VMs and containers running of all, from Pulse (homepage's pulse widget).
refresh: 60s
options:
  url: { type: url, required: true }       # e.g. http://pulse.lan:7655
  key: { type: string, secret: true }      # an API token with the monitoring:read scope
  version: { type: number, default: 1 }    # 2 for Pulse 6 and later
