id: arcane
name: Arcane
version: 0.2.0
apiVersion: 1
description: Containers running, stopped and in total, images and image updates in Arcane (homepage's arcane widget).
refresh: 1m
defaultFields: [running, stopped, total, image_updates]
options:
  url: { type: url, required: true }       # e.g. http://arcane.lan:3552
  key: { type: string, secret: true, required: true }   # an API key with containers:list, images:list and image-updates:read
  env: { type: string, default: '0' }      # the environment id; 0 is Arcane's local one
attributes:                 # public values for a service's filter: (widget.<name>)
  running: { type: number, from: running }               # Running
  stopped: { type: number, from: stopped }               # Stopped
  total: { type: number, from: total }                   # Total
  images: { type: number, from: images }                 # Images
  images_used: { type: number, from: images_used }       # Images used
  images_unused: { type: number, from: images_unused }   # Images unused
  image_updates: { type: number, from: image_updates }   # image_updates
  attention: { type: boolean, from: '@attention' }       # true while the card marks something as needing attention
