id: paperlessngx
name: Paperless-ngx
version: 0.1.0
apiVersion: 1
description: Documents in the inbox and in total (homepage's paperlessngx widget).
refresh: 5m
options:
  url: { type: url, required: true }       # e.g. http://paperless.lan:8000
  key: { type: string, secret: true }      # an API token: your profile (top right) > API Auth Token
  username: { type: string }               # instead of key
  password: { type: string, secret: true }
