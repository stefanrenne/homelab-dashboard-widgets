id: argocd
name: Argo CD
version: 0.2.0
apiVersion: 1
description: Applications by sync and health status in Argo CD (homepage's argocd widget).
refresh: 1m
defaultFields: [apps, synced, outOfSync, healthy]
options:
  url: { type: url, required: true }       # e.g. https://argocd.example.com
  key: { type: string, secret: true, required: true }   # a token of a read-only account (see the page)
attributes:                 # public values for a service's filter: (widget.<name>)
  apps: { type: number, from: apps }                 # Applications
  synced: { type: number, from: synced }             # Synced
  outOfSync: { type: number, from: outOfSync }       # Out of sync
  healthy: { type: number, from: healthy }           # Healthy
  progressing: { type: number, from: progressing }   # Progressing
  degraded: { type: number, from: degraded }         # Degraded
  suspended: { type: number, from: suspended }       # Suspended
  missing: { type: number, from: missing }           # Missing
