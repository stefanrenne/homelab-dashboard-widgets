id: suwayomi
name: Suwayomi
version: 0.2.0
apiVersion: 1
description: Manga chapters downloaded or not and read or not in Suwayomi's library (homepage's suwayomi widget).
refresh: 5m
defaultFields: [download, nondownload, read, unread]
options:
  url: { type: url, required: true }       # e.g. http://suwayomi.lan:4567
  username: { type: string }               # when Suwayomi has basic authentication on
  password: { type: string, secret: true }
  category: { type: number }               # one category's ID (?tab=<id> in its address); without it the whole library
attributes:                 # public values for a service's filter: (widget.<name>)
  download: { type: number, from: download }                         # Downloaded
  nondownload: { type: number, from: nondownload }                   # To download
  read: { type: number, from: read }                                 # Read
  unread: { type: number, from: unread }                             # Unread
  downloadedread: { type: number, from: downloadedread }             # Downloaded and read
  downloadedunread: { type: number, from: downloadedunread }         # Downloaded, unread
  nondownloadedread: { type: number, from: nondownloadedread }       # Not downloaded, read
  nondownloadedunread: { type: number, from: nondownloadedunread }   # Not downloaded, unread
