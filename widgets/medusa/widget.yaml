id: medusa
name: Medusa
version: 0.2.0
apiVersion: 1
description: Episodes wanted and snatched, and active shows, in Medusa (homepage's medusa widget).
refresh: 5m
options:
  url: { type: url, required: true }       # e.g. http://medusa.lan:8081
  key: { type: string, secret: true, required: true }   # Settings > General > Interface > API Key
attributes:                 # public values for a service's filter: (widget.<name>)
  wanted: { type: number, from: wanted }   # Wanted
  queued: { type: number, from: queued }   # Snatched
  series: { type: number, from: series }   # Shows
