id: minecraft
name: Minecraft
version: 0.2.0
apiVersion: 1
description: Whether a Minecraft server is up, its players and its version (homepage's minecraft widget).
refresh: 30s
options:
  url: { type: string, required: true }    # the server, e.g. udp://minecraft.lan:25565 (homepage's form) or minecraft.lan
  timeout: { type: number, default: 3 }    # seconds to wait for an answer
attributes:                 # public values for a service's filter: (widget.<name>)
  serviceStatus: { type: string, from: '@status' }   # up or down, as the status label
  status: { type: string, from: status }             # Status, a state such as up
  attention: { type: boolean, from: '@attention' }   # true while the card marks something as needing attention
