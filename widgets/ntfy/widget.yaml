id: ntfy
name: ntfy
version: 0.1.0
apiVersion: 1
description: The latest notification of an ntfy topic, with its title, message, priority and age (homepage's ntfy widget).
refresh: 60s
defaultFields: [title, message, priority, lastReceived]
options:
  url: { type: url, required: true }       # e.g. https://ntfy.lan (or https://ntfy.sh)
  topic: { type: string, required: true }
  key: { type: string, secret: true }      # an access token (tk_...) for a protected topic
  username: { type: string }               # or a user for a protected topic
  password: { type: string, secret: true }
