id: nextdns
name: NextDNS
version: 0.1.0
apiVersion: 1
description: Queries of a NextDNS profile resolved, blocked, allowed and relayed (homepage's nextdns widget).
refresh: 5m
options:
  profile: { type: string, required: true }   # Setup > Endpoints > ID
  key: { type: string, secret: true, required: true }   # Account > API
  url: { type: url, default: "https://api.nextdns.io" }   # only for testing against another server
