id: scrutiny
name: Scrutiny
version: 0.2.0
apiVersion: 1
description: Disks that passed, failed and are unknown in Scrutiny (homepage's scrutiny widget).
refresh: 5m
options:
  url: { type: url, required: true }       # e.g. http://scrutiny.lan:8080
attributes:                 # public values for a service's filter: (widget.<name>)
  passed: { type: number, from: passed }             # Passed
  failed: { type: number, from: failed }             # Failed
  unknown: { type: number, from: unknown }           # Unknown
  attention: { type: boolean, from: '@attention' }   # true while the card marks something as needing attention
