id: pfsense
name: pfSense
version: 0.2.0
apiVersion: 1
description: Load, memory, temperature, disk and the WAN's state and address of a pfSense firewall (homepage's pfsense widget).
refresh: 30s
defaultFields: [load, memory, temp, wanStatus]
options:
  url: { type: url, required: true }       # e.g. https://pfsense.lan
  wan: { type: string, required: true }    # the WAN's device, e.g. igb0 (Interfaces > Assignments)
  version: { type: number, default: 1 }    # 2 for pfSense API v2 (pfrest)
  username: { type: string }               # an admin, with Local Database authentication
  password: { type: string, secret: true }
  headers: { type: object, secret: true }  # or the API key: X-API-Key (v2) or Authorization "client_id client_token" (v1)
  insecure: { type: boolean, default: false }  # accept the firewall's self-signed certificate
attributes:                 # public values for a service's filter: (widget.<name>)
  status: { type: string, from: '@status' }          # up or down, as the status label
  load: { type: number, from: load }                 # Load
  memory: { type: number, from: memory }             # Memory (%)
  temp: { type: number, from: temp }                 # Temperature, in °C
  wanStatus: { type: string, from: wanStatus }       # WAN, a state such as up
  disk: { type: number, from: disk }                 # Disk (%)
  attention: { type: boolean, from: '@attention' }   # true while the card marks something as needing attention
