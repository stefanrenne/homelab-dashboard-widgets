id: pyload
name: pyLoad
version: 0.2.0
apiVersion: 1
description: Download rate, active and queued downloads in pyLoad (homepage's pyload widget).
refresh: 15s
options:
  url: { type: url, required: true }       # e.g. http://pyload.lan:8000
  username: { type: string }
  password: { type: string, secret: true }
  key: { type: string, secret: true }      # pyload-ng's API key, instead of a user
attributes:                 # public values for a service's filter: (widget.<name>)
  active: { type: number, from: active }   # Active
  queue: { type: number, from: queue }     # Queue
  total: { type: number, from: total }     # Total
