id: komga
name: Komga
version: 0.2.0
apiVersion: 1
description: Libraries, series and books in Komga (homepage's komga widget).
refresh: 5m
options:
  url: { type: url, required: true }       # e.g. http://komga.lan:25600
  username: { type: string }               # or use key
  password: { type: string, secret: true }
  key: { type: string, secret: true }      # an API key (Account settings > API Keys), instead of a user
  version: { type: number, default: 1 }    # 2 for Komga 1.x with the v2 search (POST series/list)
attributes:                 # public values for a service's filter: (widget.<name>)
  libraries: { type: number, from: libraries }   # Libraries
  series: { type: number, from: series }         # Series
  books: { type: number, from: books }           # Books
