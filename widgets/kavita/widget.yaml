id: kavita
name: Kavita
version: 0.1.0
apiVersion: 1
description: Series and files in Kavita (homepage's kavita widget).
refresh: 5m
options:
  url: { type: url, required: true }       # e.g. http://kavita.lan:5000
  username: { type: string }               # an admin user, or use key
  password: { type: string, secret: true }
  key: { type: string, secret: true }      # instead of a user: the API key under User settings > API Key
