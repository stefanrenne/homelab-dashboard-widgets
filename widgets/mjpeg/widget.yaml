id: mjpeg
name: MJPEG
version: 0.1.0
apiVersion: 1
description: A camera's MJPEG stream on the card (homepage's mjpeg widget).
options:
  stream: { type: url, required: true }    # the stream, e.g. http://printer.lan/webcam/?action=stream
  fit: { type: enum, values: [contain, cover, fill, none, scale-down], default: contain }
  height: { type: string }                 # a CSS height, e.g. 12rem (default 10rem)
