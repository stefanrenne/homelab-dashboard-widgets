id: plex
name: Plex
version: 0.2.0
apiVersion: 1
description: Active streams and the size of the movie, TV and music libraries of a Plex Media Server (homepage's plex widget).
refresh: 15s
options:
  url: { type: url, required: true }        # e.g. http://plex.lan:32400
  key: { type: string, secret: true, required: true }   # your X-Plex-Token
attributes:                 # public values for a service's filter: (widget.<name>)
  streams: { type: number, from: streams }   # Streams
  albums: { type: number, from: albums }     # Albums
  movies: { type: number, from: movies }     # Movies
  tv: { type: number, from: tv }             # TV shows
