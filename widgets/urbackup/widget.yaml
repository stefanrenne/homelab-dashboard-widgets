id: urbackup
name: UrBackup
version: 0.2.0
apiVersion: 1
description: Clients whose backups are fine, failed or not recent in UrBackup, and the space used (homepage's urbackup widget).
refresh: 5m
defaultFields: [ok, errored, noRecent]
options:
  url: { type: url, required: true }       # the web interface, e.g. http://urbackup.lan:55414
  username: { type: string }               # without one the anonymous login is used
  password: { type: string, secret: true }
  maxDays: { type: number, default: 3 }    # days after which a client's last backup is not recent
attributes:                 # public values for a service's filter: (widget.<name>)
  ok: { type: number, from: ok }                     # Fine
  errored: { type: number, from: errored }           # Failed
  noRecent: { type: number, from: noRecent }         # Not recent
  attention: { type: boolean, from: '@attention' }   # true while the card marks something as needing attention
