id: sparkyfitness
name: SparkyFitness
version: 0.1.0
apiVersion: 1
description: Calories eaten, burned and remaining and today's steps in SparkyFitness (homepage's sparkyfitness widget).
refresh: 5m
options:
  url: { type: url, required: true }       # e.g. http://sparkyfitness.lan:3004
  key: { type: string, secret: true, required: true }   # an API key from SparkyFitness's settings
