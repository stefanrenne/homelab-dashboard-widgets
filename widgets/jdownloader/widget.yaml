id: jdownloader
name: JDownloader
version: 0.2.0
apiVersion: 1
description: Packages in the download list, their size, what is left and the download rate, through My.JDownloader (homepage's jdownloader widget).
refresh: 30s
options:
  username: { type: string, required: true }   # the e-mail address of your My.JDownloader account
  password: { type: string, secret: true, required: true }
  client: { type: string, required: true }     # the device name of the JDownloader instance (Settings > My.JDownloader)
  url: { type: url, default: "https://api.jdownloader.org" }   # only for another My.JDownloader server
attributes:                 # public values for a service's filter: (widget.<name>)
  downloadCount: { type: number, from: downloadCount }   # Packages
