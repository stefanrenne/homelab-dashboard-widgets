id: navidrome
name: Navidrome
version: 0.1.0
apiVersion: 1
description: What is playing on Navidrome, one row per listener (homepage's navidrome widget).
refresh: 15s
options:
  url: { type: url, required: true }       # e.g. http://navidrome.lan:4533
  user: { type: string, required: true }
  token: { type: string, secret: true, required: true }   # md5(password + salt), as homepage takes it
  salt: { type: string, required: true }   # the salt used for token
