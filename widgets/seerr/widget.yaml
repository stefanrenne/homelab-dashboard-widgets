id: seerr
name: Seerr
version: 0.3.0
apiVersion: 1
description: Pending, approved and completed requests in Overseerr, Jellyseerr or Seerr.
refresh: 1m
aliases: [overseerr, jellyseerr]   # homepage's overseerr widget (dashboard 0.5 and later)
options:
  url: { type: url, required: true }      # e.g. http://seerr:5055
  key: { type: string, secret: true, required: true }
attributes:                 # public values for a service's filter: (widget.<name>)
  pending: { type: number, from: pending }           # Pending
  approved: { type: number, from: approved }         # Approved
  completed: { type: number, from: completed }       # Completed
  attention: { type: boolean, from: '@attention' }   # true while the card marks something as needing attention
