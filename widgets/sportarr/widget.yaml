id: sportarr
name: Sportarr
version: 0.2.0
apiVersion: 1
description: Events wanted and queued, and leagues, in Sportarr (homepage's sportarr widget).
refresh: 5m
options:
  url: { type: url, required: true }       # e.g. http://sportarr.lan:1867
  key: { type: string, secret: true, required: true }   # Settings > General > API Key
attributes:                 # public values for a service's filter: (widget.<name>)
  wanted: { type: number, from: wanted }     # Wanted
  queued: { type: number, from: queued }     # Queued
  leagues: { type: number, from: leagues }   # Leagues
