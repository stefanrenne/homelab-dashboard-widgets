id: vikunja
name: Vikunja
version: 0.1.0
apiVersion: 1
description: Projects and open tasks due within a week, overdue and in progress in Vikunja, and optionally the next tasks (homepage's vikunja widget).
refresh: 5m
options:
  url: { type: url, required: true }       # e.g. https://vikunja.lan
  key: { type: string, secret: true, required: true }   # Settings > API Tokens, with read access to projects and tasks
  version: { type: number, default: 1 }    # 2 for Vikunja 1.0.0-rc4 and later
  enableTaskList: { type: boolean, default: false }     # the next five tasks by due date as rows
