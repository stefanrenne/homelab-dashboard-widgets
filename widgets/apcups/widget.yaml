id: apcups
name: APC UPS
version: 0.2.0
apiVersion: 1
description: Status, load, battery charge and runtime left of an APC UPS through apcupsd (homepage's apcups widget).
refresh: 30s
options:
  url: { type: string, required: true }   # apcupsd's network server, e.g. tcp://nas.lan:3551
attributes:                 # public values for a service's filter: (widget.<name>)
  status: { type: string, from: status }             # Status, a state such as online
  load: { type: number, from: load }                 # Load (%)
  bcharge: { type: number, from: bcharge }           # Battery (%)
  attention: { type: boolean, from: '@attention' }   # true while the card marks something as needing attention
