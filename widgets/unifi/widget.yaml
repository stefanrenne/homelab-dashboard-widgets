id: unifi
name: UniFi Controller
version: 0.2.0
apiVersion: 1
aliases: [unifi_console]   # homepage's name for the header widget
description: Uptime, WAN status and LAN and WLAN users and devices from a UniFi Network controller (homepage's unifi widget).
refresh: 30s
defaultFields: [uptime, wan, lan_users, wlan_users]
options:
  url: { type: url, required: true }          # e.g. https://unifi.lan (UniFi OS) or https://unifi.lan:8443
  site: { type: string }                      # the site's name or description; default: the default site
  key: { type: string, secret: true }         # an API key (UniFi OS: Settings > Control Plane > Integrations), or:
  username: { type: string }                  # a local account with read access
  password: { type: string, secret: true }
  insecure: { type: boolean, default: false } # true: accept the controller's self-signed certificate
attributes:                 # public values for a service's filter: (widget.<name>)
  status: { type: string, from: '@status' }            # up or down, as the status label
  wan: { type: string, from: wan }                     # WAN, a state such as up
  lan: { type: string, from: lan }                     # LAN, a state such as up
  lan_users: { type: number, from: lan_users }         # LAN users
  lan_devices: { type: number, from: lan_devices }     # LAN devices
  wlan: { type: string, from: wlan }                   # WLAN, a state such as up
  wlan_users: { type: number, from: wlan_users }       # WLAN users
  wlan_devices: { type: number, from: wlan_devices }   # WLAN devices
  attention: { type: boolean, from: '@attention' }     # true while the card marks something as needing attention
