id: readarr
name: Readarr
version: 0.2.0
apiVersion: 1
description: Wanted and queued books and the number of books you have (homepage's readarr widget).
refresh: 1m
options:
  url: { type: url, required: true }      # e.g. http://readarr.lan:8787
  key: { type: string, secret: true, required: true }   # Settings > General > API Key
attributes:                 # public values for a service's filter: (widget.<name>)
  wanted: { type: number, from: wanted }             # Wanted
  queued: { type: number, from: queued }             # Queued
  books: { type: number, from: books }               # Books
  attention: { type: boolean, from: '@attention' }   # true while the card marks something as needing attention
