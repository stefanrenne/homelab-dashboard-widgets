id: zabbix
name: Zabbix
version: 0.1.0
apiVersion: 1
description: Problems in Zabbix by severity, from unclassified to disaster (homepage's zabbix widget).
refresh: 60s
defaultFields: [warning, average, high, disaster]
options:
  url: { type: url, required: true }       # the front end, e.g. http://zabbix.lan/zabbix
  key: { type: string, secret: true, required: true }   # Users > API tokens
