id: radarr
name: Radarr
version: 0.3.0
apiVersion: 1
description: Wanted, missing, queued and downloaded movies, with the download queue (homepage's radarr widget).
refresh: 30s
options:
  url: { type: url, required: true }      # e.g. http://radarr:7878
  key: { type: string, secret: true, required: true }
  enableQueue: { type: boolean, default: false }
  queueLimit: { type: number, default: 5 }     # rows shown; problems come first, the rest as "+N more"
attributes:                 # public values for a service's filter: (widget.<name>)
  wanted: { type: number, from: wanted }             # Wanted
  missing: { type: number, from: missing }           # Missing
  queued: { type: number, from: queued }             # Queued
  movies: { type: number, from: movies }             # Movies
  attention: { type: boolean, from: '@attention' }   # true while the card marks something as needing attention
