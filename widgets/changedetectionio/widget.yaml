id: changedetectionio
name: changedetection.io
version: 0.2.0
apiVersion: 1
description: Watches with an unseen change, and all watches, in changedetection.io (homepage's changedetectionio widget).
refresh: 5m
options:
  url: { type: url, required: true }       # e.g. http://changedetection.lan:5000
  key: { type: string, secret: true, required: true }   # Settings > API
attributes:                 # public values for a service's filter: (widget.<name>)
  diffsDetected: { type: number, from: diffsDetected }   # Changes
  totalObserved: { type: number, from: totalObserved }   # Watched
  attention: { type: boolean, from: '@attention' }       # true while the card marks something as needing attention
