id: homeassistant
name: Home Assistant
version: 0.1.0
apiVersion: 1
description: People at home, lights and switches that are on, or up to four states and templates of your own (homepage's homeassistant widget).
refresh: 30s
options:
  url: { type: url, required: true }        # e.g. http://homeassistant.lan:8123
  key: { type: string, secret: true, required: true }   # a long-lived access token: your profile > Security
  # up to four of { state: <entity_id>, label?, value? } or { template: <Jinja>, label }, as in homepage
  custom: { type: list }
