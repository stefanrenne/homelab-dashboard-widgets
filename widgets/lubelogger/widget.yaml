id: lubelogger
name: LubeLogger
version: 0.1.0
apiVersion: 1
description: Vehicles, service records and reminders in LubeLogger, or one vehicle with its next reminder (homepage's lubelogger widget).
refresh: 5m
options:
  url: { type: url, required: true }       # e.g. https://lubelogger.lan
  username: { type: string }               # when LubeLogger's authentication is on
  password: { type: string, secret: true }
  vehicleID: { type: number }              # one vehicle (the number in its address)
