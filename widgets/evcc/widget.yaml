id: evcc
name: evcc
version: 0.2.0
apiVersion: 1
description: Solar, grid, home and charging power from evcc (homepage's evcc widget).
refresh: 15s
options:
  url: { type: url, required: true }       # e.g. http://evcc.lan:7070
attributes:                 # public values for a service's filter: (widget.<name>)
  pv_power: { type: number, from: pv_power }           # Solar, in kW
  grid_power: { type: number, from: grid_power }       # Grid, in kW
  home_power: { type: number, from: home_power }       # Home, in kW
  charge_power: { type: number, from: charge_power }   # Charging, in kW
