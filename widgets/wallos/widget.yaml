id: wallos
name: Wallos
version: 0.2.0
apiVersion: 1
description: Active subscriptions, the next to renew and the cost of last, this and next month in Wallos (homepage's wallos widget).
refresh: 1h
defaultFields: [activeSubscriptions, nextRenewingSubscription, thisMonthlyCost, nextMonthlyCost]
options:
  url: { type: url, required: true }       # e.g. http://wallos.lan:8282
  key: { type: string, secret: true, required: true }   # Profile > API Key
attributes:                 # public values for a service's filter: (widget.<name>)
  activeSubscriptions: { type: number, from: activeSubscriptions }   # Active
