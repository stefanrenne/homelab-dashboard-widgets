id: uptimekuma
name: Uptime Kuma
version: 0.2.0
apiVersion: 1
description: Monitors up and down, average uptime and the incident of one status page (homepage's uptimekuma widget).
refresh: 1m
options:
  url: { type: url, required: true }       # e.g. http://uptime-kuma.lan:3001
  slug: { type: string, required: true }   # the status page's address after /status/
attributes:                 # public values for a service's filter: (widget.<name>)
  up: { type: number, from: up }                     # Up
  down: { type: number, from: down }                 # Down
  uptime: { type: number, from: uptime }             # Uptime (%)
  attention: { type: boolean, from: '@attention' }   # true while the card marks something as needing attention
