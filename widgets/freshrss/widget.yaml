id: freshrss
name: FreshRSS
version: 0.2.0
apiVersion: 1
description: Unread articles and subscriptions in FreshRSS (homepage's freshrss widget).
refresh: 5m
options:
  url: { type: url, required: true }       # e.g. http://freshrss.lan:8080
  username: { type: string, required: true }
  password: { type: string, secret: true, required: true }   # the API password of the user's profile
attributes:                 # public values for a service's filter: (widget.<name>)
  unread: { type: number, from: unread }                 # Unread
  subscriptions: { type: number, from: subscriptions }   # Feeds
