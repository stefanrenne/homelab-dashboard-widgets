id: headscale
name: Headscale
version: 0.1.0
apiVersion: 1
description: A node's name, address, last seen and online state in Headscale (homepage's headscale widget).
refresh: 60s
options:
  url: { type: url, required: true }       # e.g. https://headscale.lan
  nodeId: { type: string, required: true } # the ID from `headscale nodes list`
  key: { type: string, secret: true, required: true }   # from `headscale apikeys create`
