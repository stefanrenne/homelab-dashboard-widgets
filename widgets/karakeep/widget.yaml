id: karakeep
name: Karakeep
version: 0.1.0
apiVersion: 1
description: Bookmarks, favorites, archived items, highlights, lists and tags in Karakeep (homepage's karakeep widget).
refresh: 5m
defaultFields: [bookmarks, favorites, archived, highlights]
options:
  url: { type: url, required: true }       # e.g. http://karakeep.lan:3000
  key: { type: string, secret: true, required: true }   # User Settings > API Keys
