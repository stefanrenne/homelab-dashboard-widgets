id: deluge
name: Deluge
version: 0.1.0
apiVersion: 1
description: Torrents downloading and seeding with their rates, and optionally the downloads one per row (homepage's deluge widget).
refresh: 10s
options:
  url: { type: url, required: true }       # e.g. http://deluge.lan:8112
  password: { type: string, secret: true, required: true }   # the Web UI password
  enableLeechProgress: { type: boolean, default: false }     # a row per download with its progress and time left
  queueLimit: { type: number, default: 5 }  # rows before "+N more"
