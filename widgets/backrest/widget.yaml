id: backrest
name: Backrest
version: 0.1.0
apiVersion: 1
description: The latest backups that succeeded and failed, and the last 30 days of Backrest's plans (homepage's backrest widget).
refresh: 5m
defaultFields: [num_success_latest, num_failure_latest, num_failure_30, bytes_added_30]
options:
  url: { type: url, required: true }       # e.g. http://backrest.lan:9898
  username: { type: string }               # with authentication on in Backrest
  password: { type: string, secret: true }
