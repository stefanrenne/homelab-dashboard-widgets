id: backrest
name: Backrest
version: 0.2.0
apiVersion: 1
description: The latest backups that succeeded and failed, and the last 30 days of Backrest's plans (homepage's backrest widget).
refresh: 5m
defaultFields: [num_success_latest, num_failure_latest, num_failure_30, bytes_added_30]
options:
  url: { type: url, required: true }       # e.g. http://backrest.lan:9898
  username: { type: string }               # with authentication on in Backrest
  password: { type: string, secret: true }
attributes:                 # public values for a service's filter: (widget.<name>)
  num_plans: { type: number, from: num_plans }                     # Plans
  num_success_latest: { type: number, from: num_success_latest }   # Last OK
  num_failure_latest: { type: number, from: num_failure_latest }   # Last failed
  num_success_30: { type: number, from: num_success_30 }           # OK in 30 days
  num_failure_30: { type: number, from: num_failure_30 }           # Failed 30 days
  attention: { type: boolean, from: '@attention' }                 # true while the card marks something as needing attention
