id: crowdsec
name: CrowdSec
version: 0.1.0
apiVersion: 1
description: Alerts of the last 24 hours and active bans of a CrowdSec local API (homepage's crowdsec widget).
refresh: 5m
options:
  url: { type: url, required: true }       # the local API, e.g. http://crowdsec.lan:8080
  username: { type: string, required: true }               # a machine_id (see /etc/crowdsec/local_api_credentials.yaml)
  password: { type: string, secret: true, required: true }
