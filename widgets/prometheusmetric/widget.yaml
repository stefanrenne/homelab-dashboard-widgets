id: prometheusmetric
name: Prometheus Metric
version: 0.1.0
apiVersion: 1
description: Up to four PromQL query results with your own labels and formats (homepage's prometheusmetric widget).
refresh: 10s
options:
  url: { type: url, required: true }       # e.g. http://prometheus.lan:9090
  metrics: { type: list, required: true }  # [{ label, query, key?, format: { type, scale, prefix, suffix, options } }]
  username: { type: string }               # when Prometheus sits behind basic authentication
  password: { type: string, secret: true }
