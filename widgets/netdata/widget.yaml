id: netdata
name: Netdata
version: 0.2.0
apiVersion: 1
description: Warning and critical alarms in Netdata (homepage's netdata widget).
refresh: 60s
options:
  url: { type: url, required: true }       # e.g. http://netdata.lan:19999
attributes:                 # public values for a service's filter: (widget.<name>)
  warnings: { type: number, from: warnings }         # Warnings
  criticals: { type: number, from: criticals }       # Critical
  attention: { type: boolean, from: '@attention' }   # true while the card marks something as needing attention
