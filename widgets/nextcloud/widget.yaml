id: nextcloud
name: Nextcloud
version: 0.1.0
apiVersion: 1
description: Free space, active users, files and shares of a Nextcloud server (homepage's nextcloud widget).
refresh: 5m
defaultFields: [freespace, activeusers, numfiles, numshares]
options:
  url: { type: url, required: true }       # e.g. https://cloud.example.com
  key: { type: string, secret: true }      # the NC-Token: Administration settings > System
  username: { type: string }               # an admin, instead of key
  password: { type: string, secret: true } # an app password: Personal settings > Security
