id: watchtower
name: Watchtower
version: 0.1.0
apiVersion: 1
description: Containers scanned, updated and failed in Watchtower's last run (homepage's watchtower widget).
refresh: 5m
options:
  url: { type: url, required: true }       # e.g. http://watchtower.lan:8080
  key: { type: string, secret: true, required: true }   # WATCHTOWER_HTTP_API_TOKEN
