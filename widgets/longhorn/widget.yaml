id: longhorn
name: Longhorn
version: 0.2.0
apiVersion: 1
description: Storage of the Longhorn nodes in a Kubernetes cluster, in total and per node (homepage's longhorn info widget).
refresh: 1m
options:
  url: { type: url, required: true }          # Longhorn's UI/API, e.g. https://longhorn.lan; or provider: longhorn
  username: { type: string }                  # when the UI is behind basic auth
  password: { type: string, secret: true }
  total: { type: boolean, default: true }     # all nodes together
  nodes: { type: boolean, default: true }     # one block per node
  include: { type: list, default: [] }        # only these nodes (all when empty)
  labels: { type: boolean, default: true }    # the node names as labels (else "node 1", ...)
  expanded: { type: boolean, default: false } # free of total per node as rows with a bar
attributes:                 # public values for a service's filter: (widget.<name>)
  total: { type: number, from: total }               # Total (%)
  node1: { type: number, from: node1 }               # node1 (%)
  node2: { type: number, from: node2 }               # node2 (%)
  node3: { type: number, from: node3 }               # node3 (%)
  attention: { type: boolean, from: '@attention' }   # true while the card marks something as needing attention
