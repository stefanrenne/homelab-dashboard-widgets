id: yourspotify
name: Your Spotify
version: 0.2.0
apiVersion: 1
description: Songs, listening time and artists over the past day, week, month or year in Your Spotify (homepage's yourspotify widget).
refresh: 15m
options:
  url: { type: url, required: true }       # the API, e.g. http://spotify.lan:8080 (with linuxserver's image: http://spotify.lan/api)
  key: { type: string, secret: true, required: true }   # Settings > Account > Public token: the part after ?token=
  interval: { type: enum, values: [day, week, month, year, all], default: week }
attributes:                 # public values for a service's filter: (widget.<name>)
  songs: { type: number, from: songs }       # Songs
  artists: { type: number, from: artists }   # Artists
