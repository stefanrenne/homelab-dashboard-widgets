id: linkwarden
name: Linkwarden
version: 0.2.0
apiVersion: 1
description: Links, collections and tags in Linkwarden (homepage's linkwarden widget).
refresh: 5m
options:
  url: { type: url, required: true }       # e.g. http://linkwarden.lan:3000
  key: { type: string, secret: true, required: true }   # Settings > Access Tokens
attributes:                 # public values for a service's filter: (widget.<name>)
  links: { type: number, from: links }               # Links
  collections: { type: number, from: collections }   # Collections
  tags: { type: number, from: tags }                 # Tags
