id: npm
name: Nginx Proxy Manager
version: 0.1.0
apiVersion: 1
description: Proxy hosts enabled, disabled and in total (homepage's npm widget).
refresh: 5m
options:
  url: { type: url, required: true }       # e.g. http://npm.lan:81
  username: { type: string, required: true }               # the e-mail address of a view-only user
  password: { type: string, secret: true, required: true }
