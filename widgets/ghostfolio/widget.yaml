id: ghostfolio
name: Ghostfolio
version: 0.1.0
apiVersion: 1
description: Portfolio performance today, over a year and in total, and the net worth, in Ghostfolio (homepage's ghostfolio widget).
refresh: 5m
defaultFields: [gross_percent_today, gross_percent_1y, gross_percent_max]
options:
  url: { type: url, required: true }       # e.g. http://ghostfolio.lan:3333
  key: { type: string, secret: true, required: true }   # the bearer token from /api/v1/auth/anonymous (valid 6 months)
