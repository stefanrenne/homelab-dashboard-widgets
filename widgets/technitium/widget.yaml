id: technitium
name: Technitium DNS Server
version: 0.2.0
apiVersion: 1
description: Queries of a Technitium DNS server by outcome, and its clients (homepage's technitium widget).
refresh: 60s
defaultFields: [totalQueries, totalAuthoritative, totalCached, totalServerFailure]
options:
  url: { type: url, required: true }       # e.g. http://dns.lan:5380
  key: { type: string, secret: true, required: true }   # an API token (Administration > Sessions > Create Token), best for its own user
  node: { type: string }                   # a cluster node's name, or cluster for all nodes; without it the server asked
  range: { type: enum, values: [LastHour, LastDay, LastWeek, LastMonth, LastYear], default: LastHour }
attributes:                 # public values for a service's filter: (widget.<name>)
  totalQueries: { type: number, from: totalQueries }               # Queries
  totalNoError: { type: number, from: totalNoError }               # No error
  totalServerFailure: { type: number, from: totalServerFailure }   # Server failure
  totalNxDomain: { type: number, from: totalNxDomain }             # NX domain
  totalRefused: { type: number, from: totalRefused }               # Refused
  totalAuthoritative: { type: number, from: totalAuthoritative }   # Own zones
  totalRecursive: { type: number, from: totalRecursive }           # Recursive
  totalCached: { type: number, from: totalCached }                 # Cached
  totalBlocked: { type: number, from: totalBlocked }               # Blocked
  totalDropped: { type: number, from: totalDropped }               # Dropped
  totalClients: { type: number, from: totalClients }               # Clients
  attention: { type: boolean, from: '@attention' }                 # true while the card marks something as needing attention
