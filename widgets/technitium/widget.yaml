id: technitium
name: Technitium DNS Server
version: 0.1.0
apiVersion: 1
description: Queries of a Technitium DNS server by outcome, with their share, and its clients (homepage's technitium widget).
refresh: 60s
defaultFields: [totalQueries, totalAuthoritative, totalCached, totalServerFailure]
options:
  url: { type: url, required: true }       # e.g. http://dns.lan:5380
  key: { type: string, secret: true, required: true }   # an API token (Administration > Sessions > Create Token), best for its own user
  node: { type: string }                   # a cluster node's name, or cluster for all nodes; without it the server asked
  range: { type: enum, values: [LastHour, LastDay, LastWeek, LastMonth, LastYear], default: LastHour }
