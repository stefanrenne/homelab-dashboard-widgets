id: whatsupdocker
name: What's up Docker
version: 0.3.0
apiVersion: 1
description: Containers being watched and how many have an update.
refresh: 5m
options:
  url: { type: url, required: true }      # e.g. http://wud:3000
  username: { type: string }
  password: { type: string, secret: true }
attributes:                 # public values for a service's filter: (widget.<name>)
  monitoring: { type: number, from: monitoring }     # Monitoring
  updates: { type: number, from: updates }           # Updates
  attention: { type: boolean, from: '@attention' }   # true while the card marks something as needing attention
