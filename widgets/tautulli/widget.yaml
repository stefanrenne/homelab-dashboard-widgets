id: tautulli
name: Tautulli
version: 0.3.0
apiVersion: 1
description: Current Plex streams with their progress.
refresh: 15s
options:
  url: { type: url, required: true }      # e.g. http://tautulli:8181
  key: { type: string, secret: true, required: true }
  enableUser: { type: boolean, default: false }
  showEpisodeNumber: { type: boolean, default: false }
