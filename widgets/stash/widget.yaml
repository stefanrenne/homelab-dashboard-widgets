id: stash
name: Stash
version: 0.3.0
apiVersion: 1
description: Library counts from Stash. Shows scenes, performers and tags; pick others with `fields`.
defaultFields: [scenes, performers, tags]
refresh: 5m
options:
  url: { type: url, required: true }      # e.g. http://stash:9999
  key: { type: string, secret: true }
attributes:                 # public values for a service's filter: (widget.<name>)
  scenes: { type: number, from: scenes }           # Scenes
  images: { type: number, from: images }           # Images
  galleries: { type: number, from: galleries }     # Galleries
  performers: { type: number, from: performers }   # Performers
  studios: { type: number, from: studios }         # Studios
  tags: { type: number, from: tags }               # Tags
