id: stash
name: Stash
version: 0.2.0
apiVersion: 1
description: Library counts from Stash. Shows scenes, performers and tags; pick others with `fields`.
defaultFields: [scenes, performers, tags]
refresh: 5m
options:
  url: { type: url, required: true }      # e.g. http://stash:9999
  key: { type: string, secret: true }
