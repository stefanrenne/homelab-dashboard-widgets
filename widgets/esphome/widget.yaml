id: esphome
name: ESPHome
version: 0.2.0
apiVersion: 1
description: ESPHome devices online, offline and unknown (homepage's esphome widget).
refresh: 1m
defaultFields: [online, offline, offline_alt, total]
options:
  url: { type: url, required: true }       # the ESPHome dashboard, e.g. http://esphome.lan:6052
  username: { type: string }               # with authentication on in the dashboard
  password: { type: string, secret: true }
  key: { type: string, secret: true }      # instead: the value of the dashboard's "authenticated" cookie
attributes:                 # public values for a service's filter: (widget.<name>)
  online: { type: number, from: online }             # Online
  offline: { type: number, from: offline }           # Offline
  offline_alt: { type: number, from: offline_alt }   # Not online
  unknown: { type: number, from: unknown }           # Unknown
  total: { type: number, from: total }               # Total
  attention: { type: boolean, from: '@attention' }   # true while the card marks something as needing attention
