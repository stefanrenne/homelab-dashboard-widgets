id: mastodon
name: Mastodon
version: 0.2.0
apiVersion: 1
description: Users, posts and known domains of a Mastodon instance (homepage's mastodon widget).
refresh: 15m
options:
  url: { type: url, required: true }       # the instance, e.g. https://mastodon.example.com
attributes:                 # public values for a service's filter: (widget.<name>)
  user_count: { type: number, from: user_count }       # Users
  status_count: { type: number, from: status_count }   # Posts
  domain_count: { type: number, from: domain_count }   # Domains
