id: octoprint
name: OctoPrint
version: 0.2.0
apiVersion: 1
description: A 3D printer's state, tool and bed temperatures and the job's progress in OctoPrint (homepage's octoprint widget).
refresh: 10s
options:
  url: { type: url, required: true }       # e.g. http://octopi.lan
  key: { type: string, secret: true, required: true }   # Settings > Application Keys (or the global API key)
attributes:                 # public values for a service's filter: (widget.<name>)
  printer_state: { type: string, from: printer_state }     # Printer, a state such as printing
  temp_tool: { type: number, from: temp_tool }             # Tool, in °C
  temp_bed: { type: number, from: temp_bed }               # Bed, in °C
  job_completion: { type: number, from: job_completion }   # Progress (%)
  attention: { type: boolean, from: '@attention' }         # true while the card marks something as needing attention
