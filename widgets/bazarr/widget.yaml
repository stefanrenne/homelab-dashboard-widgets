id: bazarr
name: Bazarr
version: 0.3.0
apiVersion: 1
description: Episodes and movies that still miss subtitles.
refresh: 5m
options:
  url: { type: url, required: true }      # e.g. http://bazarr:6767
  key: { type: string, secret: true, required: true }
attributes:                 # public values for a service's filter: (widget.<name>)
  missingEpisodes: { type: number, from: missingEpisodes }   # Missing Episodes
  missingMovies: { type: number, from: missingMovies }       # Missing Movies
