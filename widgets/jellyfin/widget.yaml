id: jellyfin
name: Jellyfin
version: 0.1.0
apiVersion: 1
description: What is playing on Jellyfin, one row per stream, and optionally the library counts (homepage's jellyfin widget).
refresh: 10s
options:
  url: { type: url, required: true }       # e.g. http://jellyfin.lan:8096
  key: { type: string, secret: true, required: true }   # Dashboard > API Keys
  enableNowPlaying: { type: boolean, default: true }    # a row per stream that is playing
  enableBlocks: { type: boolean, default: false }       # movies, series, episodes, songs and albums
  enableUser: { type: boolean, default: false }         # the user's name after the title
  showEpisodeNumber: { type: boolean, default: false }  # S01 · E02 in episode titles
  version: { type: number, default: 1 }    # homepage's option for Jellyfin 10.12; not needed here (both versions work)
