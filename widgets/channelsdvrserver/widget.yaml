id: channelsdvrserver
name: Channels DVR Server
version: 0.2.0
apiVersion: 1
description: Shows, recordings, scheduled recordings and passes of a Channels DVR Server (homepage's channelsdvrserver widget).
refresh: 5m
options:
  url: { type: url, required: true }       # e.g. http://channels.lan:8089
attributes:                 # public values for a service's filter: (widget.<name>)
  shows: { type: number, from: shows }             # Shows
  recordings: { type: number, from: recordings }   # Recordings
  scheduled: { type: number, from: scheduled }     # Scheduled
  passes: { type: number, from: passes }           # Passes
