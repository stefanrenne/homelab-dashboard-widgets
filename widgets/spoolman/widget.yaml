id: spoolman
name: Spoolman
version: 0.2.0
apiVersion: 1
description: What is left on up to four filament spools in Spoolman (homepage's spoolman widget).
refresh: 5m
options:
  url: { type: url, required: true }       # e.g. http://spoolman.lan:7912
  spoolIds: { type: list }                 # the spools to show, e.g. [1, 2, 3, 4]; without it the first four
attributes:                 # public values for a service's filter: (widget.<name>)
  spool1: { type: number, from: spool1 }             # spool1 (%)
  spool2: { type: number, from: spool2 }             # spool2 (%)
  spool3: { type: number, from: spool3 }             # spool3 (%)
  attention: { type: boolean, from: '@attention' }   # true while the card marks something as needing attention
