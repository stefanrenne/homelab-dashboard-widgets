id: pangolin
name: Pangolin
version: 0.1.0
apiVersion: 1
description: Sites online, healthy resources and targets, and the traffic of a Pangolin organization (homepage's pangolin widget).
refresh: 60s
defaultFields: [sites, resources, targets, traffic]
options:
  url: { type: url, required: true }       # the Integration API, e.g. https://api.pangolin.net or https://pangolin.lan/api
  key: { type: string, secret: true, required: true }   # an API key with List Sites and List Resources
  org: { type: string, required: true }    # the organization's ID, from the address after logging in
