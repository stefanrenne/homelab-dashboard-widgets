id: sabnzbd
name: SABnzbd
version: 0.3.0
apiVersion: 1
description: Download rate, queue length and time left.
refresh: 10s
options:
  url: { type: url, required: true }      # e.g. http://sabnzbd:8080
  key: { type: string, secret: true, required: true }
attributes:                 # public values for a service's filter: (widget.<name>)
  queue: { type: number, from: queue }               # Queue
  attention: { type: boolean, from: '@attention' }   # true while the card marks something as needing attention
