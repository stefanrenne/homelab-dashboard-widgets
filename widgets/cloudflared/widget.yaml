id: cloudflared
name: Cloudflare Tunnel
version: 0.1.0
apiVersion: 1
description: The status and origin IP of a Cloudflare Tunnel (homepage's cloudflared widget).
refresh: 5m
options:
  accountid: { type: string, required: true }   # in the Zero Trust dashboard's address: one.dash.cloudflare.com/<accountid>/
  tunnelid: { type: string, required: true }    # under the tunnel's name in Networks > Tunnels
  key: { type: string, secret: true, required: true }   # an API token with Account > Cloudflare Tunnel > Read
  url: { type: url, default: https://api.cloudflare.com }   # the Cloudflare API
